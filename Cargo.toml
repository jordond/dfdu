[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [
    "crates/dfdu",
    "crates/dfdu-clean",
    "crates/dfdu-engine",
    "crates/dfdu-hangfs",
    "crates/dfdu-rules",
    "crates/dfdu-scan",
    "crates/dfdu-sim",
    "crates/dfdu-store",
    "crates/dfdu-sys",
    "crates/dfdu-tree",
    "crates/dfdu-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/jordond/dfdu"
homepage = "https://github.com/jordond/dfdu"
publish = false

[workspace.dependencies]
dfdu-tree = { path = "crates/dfdu-tree" }
dfdu-scan = { path = "crates/dfdu-scan" }
dfdu-engine = { path = "crates/dfdu-engine" }
dfdu-clean = { path = "crates/dfdu-clean" }
dfdu-rules = { path = "crates/dfdu-rules" }
dfdu-tui = { path = "crates/dfdu-tui" }
dfdu-sys = { path = "crates/dfdu-sys" }
dfdu-store = { path = "crates/dfdu-store" }
dfdu-bench = { path = "crates/dfdu-bench" }
crossbeam-channel = "0.5.17"
crossbeam-deque = "0.8.8"
parking_lot = "0.13.0"
clap = { version = "4.6.7", features = ["derive"] }
clap_mangen = "0.3.3"
clap_complete = "4.6.11"
anyhow = "1.0.104"
os_str_bytes = { version = "7.2.1", features = ["conversions"] }
dunce = "1.0.5"
etcetera = "0.11.0"
crc32c = "0.6.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
hex = "0.4.3"
boon = "0.6.1"
gix-index = "0.58.0"
gix-discover = "0.57.1"
gix-hash = { version = "0.28.1", features = ["sha1"] }
gix-path = "0.14.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
ruzstd = "0.9.1"
humansize = "2.1.3"
fixedbitset = "0.5.7"
tempfile = "3.27.0"
rustix = { version = "1.1.5", features = ["fs", "process"] }
libc = "0.2.191"
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }
rand = { version = "0.10.3", default-features = false, features = ["chacha"] }
ratatui = "0.30.2"
tachyonfx = { version = "0.25.2", default-features = false, features = ["std", "std-duration"] }
nucleo-matcher = "0.3.1"
terminal-colorsaurus = "1.0.3"
insta = "1.49.0"
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
loom = "0.7.2"
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
fuser = { version = "0.18.0", default-features = false }
dfdu-hangfs = { path = "crates/dfdu-hangfs" }

[workspace.lints.rust]
unsafe_code = "forbid"
# `--cfg loom` builds the scanner's synchronisation on `loom` (crates/dfdu-scan/src/sync.rs).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1

# Optimised test builds that keep debug assertions and overflow checks, without release's slow LTO.
[profile.ci]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 16

# The release build: `dist build` and `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"
strip = true
