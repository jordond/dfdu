[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
dut-tree = { path = "crates/dut-tree" }
dut-scan = { path = "crates/dut-scan" }
dut-engine = { path = "crates/dut-engine" }
dut-clean = { path = "crates/dut-clean" }
dut-tui = { path = "crates/dut-tui" }
dut-sys = { path = "crates/dut-sys" }
dut-bench = { path = "crates/dut-bench" }
crossbeam-channel = "0.5.17"
crossbeam-deque = "0.8.8"
parking_lot = "0.13.0"
proptest = "1.12.0"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
os_str_bytes = { version = "7.2.1", features = ["conversions"] }
dunce = "1.0.5"
etcetera = "0.11.0"
crc32c = "0.6.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
hex = "0.4.3"
humansize = "2.1.3"
fixedbitset = "0.5.7"
tempfile = "3.27.0"
rustix = { version = "1.1.5", features = ["fs", "process"] }
libc = "0.2.191"
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }
rand = { version = "0.10.3", default-features = false, features = ["chacha"] }
ratatui = "0.30.2"
loom = "0.7.2"
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
fuser = { version = "0.18.0", default-features = false }
dut-hangfs = { path = "crates/dut-hangfs" }

[workspace.lints.rust]
unsafe_code = "forbid"
# `--cfg loom` builds the scanner's synchronisation on `loom` (crates/dut-scan/src/sync.rs).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
