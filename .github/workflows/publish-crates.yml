name: publish-crates

# Publishes dfdu and the crates it needs to crates.io (post-announce-jobs in
# dist-workspace.toml), from the tagged commit, once dist has published the GitHub release.
#
# Authenticates with crates.io's Trusted Publishing: rust-lang/crates-io-auth-action trades
# this job's GitHub OIDC token for a publish token that expires after 30 minutes and is revoked
# when the job ends, so no registry token is stored. In each crate's crates.io settings, the
# trusted publisher is owner jordond, repository dfdu, workflow `release.yml` (crates.io checks
# the token's workflow_ref, which names the calling workflow, not this one) and environment
# `release`. Trusted publishing can't create a crate, so a crate's first version is published
# by hand with a token (cargo xtask release publish).
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  crates:
    name: Publish to crates.io
    runs-on: ubuntu-26.04
    # Tags only (dist calls publish jobs for version tags), and not prereleases unless dist is
    # set to publish them.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && (!fromJson(inputs.plan).announcement_is_prerelease || fromJson(inputs.plan).publish_prereleases) }}
    # The GitHub environment the trusted publishers name; its deployment rules allow only
    # version tags.
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # the OIDC token crates.io exchanges for a publish token
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # rust-toolchain.toml names stable: update it to the current release, not the image's.
        run: |
          rustup toolchain install stable --profile minimal
          cargo --version
      # No cache: a release build shouldn't read what other workflows could have written.
      # Package and build every crate from its packaged sources before there is a token, so no
      # dependency's build script or proc macro runs while one is in the environment.
      - name: Verify the packages
        run: cargo publish --workspace --locked --dry-run
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # In dependency order; verified above, so no build runs here.
        run: cargo publish --workspace --locked --no-verify
