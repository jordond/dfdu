name: fuzz

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "600"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"
  NIGHTLY: nightly-2026-10-27

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.NIGHTLY }}
      - name: Restore fuzz build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz@0.13.2
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Run each target from its corpus, seeds and regressions
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
        run: |
          [[ $SECONDS_PER_TARGET =~ ^[0-9]+$ ]] || { echo "::error::seconds must be a number"; exit 1; }
          .github/scripts/fuzz.sh "$NIGHTLY" "$SECONDS_PER_TARGET"
      - name: Minimise the corpus
        if: ${{ !cancelled() }}
        run: |
          cd fuzz
          # For the toolchain's host, as fuzz.sh builds: cargo-fuzz's own default may be musl.
          host=$(rustc "+$NIGHTLY" -vV | sed -n 's/^host: //p')
          for t in $(cargo "+$NIGHTLY" fuzz list); do
            cargo "+$NIGHTLY" fuzz cmin --target "$host" "$t" "corpus/$t" -- -rss_limit_mb=2048 -timeout=10 || true
          done
      - name: Save the corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          retention-days: 30
