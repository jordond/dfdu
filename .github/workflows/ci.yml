name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - &checkout
        name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version" || { echo "::error::No rust-version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - &cache
        name: Restore build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-machete
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-machete
      # Each check runs even when an earlier one failed, so one run reports them all.
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: cargo xtask fmt --check
      - name: Audit workflows with zizmor
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
      - name: Run cargo-deny
        if: ${{ !cancelled() }}
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources
      - name: Find unused dependencies
        if: ${{ !cancelled() }}
        run: cargo xtask machete
      - name: Check the workspace builds on the MSRV
        if: ${{ !cancelled() }}
        run: cargo xtask msrv
      # The fuzz crate is not a workspace member, and only the nightly fuzz run builds it.
      - name: Check the fuzz targets build
        if: ${{ !cancelled() }}
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - *checkout
      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - *cache
      - name: Run clippy
        run: cargo xtask clippy

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - *checkout
      - &stable
        name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - *cache
      - name: Install cargo-nextest
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      - name: Run tests and doc tests
        run: cargo xtask test --ci

  coverage:
    name: Test and coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIN_LINES: 85
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install Rust stable with llvm-tools
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - *cache
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Run tests with coverage
        run: cargo xtask coverage --no-fail
      - name: Write coverage report, summary and PR comment
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: .github/scripts/coverage-report.sh "$MIN_LINES" "$BASE"
      - &upload-section
        name: Upload the PR comment section
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-${{ github.job }}
          path: ${{ github.job }}.md
          retention-days: 1
      - name: Require 85% line coverage
        run: cargo llvm-cov report --summary-only --fail-under-lines "$MIN_LINES"
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
          retention-days: 14

  bench:
    name: Benchmark against base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - *checkout
      - name: Check out base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - *stable
      - name: Install hyperfine
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: hyperfine
      - name: Time warm scans of base and head
        run: .github/scripts/bench-base.sh base "$RUNNER_TEMP"
      - *upload-section

  pr-comment:
    name: PR comment
    needs: [coverage, bench]
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Check out the comment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Download the comment sections
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pr-*
          merge-multiple: true
          path: ${{ runner.temp }}/pr
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for part in coverage bench; do
            f=$RUNNER_TEMP/pr/$part.md
            if [[ -f $f ]]; then cat "$f"; else echo "No $part result: the job failed."; fi
            echo
          done > "$RUNNER_TEMP/comment.md"
          .github/scripts/sticky-comment.sh ci "$RUNNER_TEMP/comment.md"

  simulation:
    name: Simulation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - *checkout
      - *stable
      - *cache
      - name: Run simulation, 5000 seeds per suite
        run: cargo xtask sim --seeds 5000

  loom:
    name: Loom
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - *checkout
      - *stable
      - *cache
      - name: Run loom model tests
        run: cargo xtask loom

  fuse:
    name: FUSE
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - *stable
      - *cache
      - name: Load the fuse kernel module
        run: sudo modprobe fuse || true
      - name: Build tests
        run: cargo test --profile ci --locked --no-run -p dfdu-hangfs -p dfdu-demofs -p dfdu-engine -p dfdu
      - name: Run FUSE tests as root
        run: |
          cargo test --profile ci --locked -p dfdu-hangfs --lib
          cargo test --profile ci --locked -p dfdu-demofs --test mount
          cargo test --profile ci --locked -p dfdu-engine -p dfdu --test fuse
        env:
          DFDU_FUSE_REQUIRED: "1"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo --preserve-env=DFDU_FUSE_REQUIRED,HOME

  btrfs:
    name: Btrfs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - *stable
      - *cache
      - name: Set the btrfs mount directory
        run: echo "DFDU_BTRFS_DIR=$RUNNER_TEMP/btrfs" >> "$GITHUB_ENV"
      - name: Install btrfs tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends btrfs-progs btrfs-compsize
      - name: Build tests
        run: cargo test --profile ci --locked --no-run -p dfdu-sys -p dfdu-clean -p dfdu-engine -p dfdu-tui -p dfdu-store
      - name: Create the btrfs fixture
        run: sudo scripts/btrfs-fixture.sh "$RUNNER_TEMP/btrfs.img" "$DFDU_BTRFS_DIR" "$(id -un)"
      - name: Run btrfs tests unprivileged
        run: |
          cargo test --profile ci --locked -p dfdu-sys -p dfdu-engine --test btrfs
          cargo test --profile ci --locked -p dfdu-tui --lib tests::btrfs::
      - name: Run btrfs tests as root
        run: |
          cargo test --profile ci --locked -p dfdu-sys -p dfdu-engine --test btrfs
          cargo test --profile ci --locked -p dfdu-tui --lib tests::btrfs::
          cargo test --profile ci --locked -p dfdu-store --test resume btrfs
          cargo test --profile ci --locked -p dfdu-clean --lib
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo --preserve-env=DFDU_BTRFS_DIR,HOME

  binaries:
    name: Binary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - *checkout
      - *stable
      - *cache
      - name: Build dfdu
        run: cargo build --release --locked -p dfdu
      - name: Upload dfdu
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dfdu-${{ runner.os }}-${{ runner.arch }}
          path: target/release/dfdu${{ runner.os == 'Windows' && '.exe' || '' }}
          retention-days: 7

  ci-success:
    name: CI success
    if: always()
    needs:
      [lint, clippy, test, coverage, simulation, loom, fuse, btrfs, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
