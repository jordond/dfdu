name: ci

on:
  workflow_dispatch:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --no-fail-fast

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - run: cargo check --all-targets

  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Simulation, 5000 seeds per suite
        run: cargo test --release -p dfdu-sim
        env:
          DFDU_SIM_SEEDS: "5000"

  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release -p dfdu-scan -p dfdu-engine --test loom
        env:
          RUSTFLAGS: "--cfg loom"

  fuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo modprobe fuse || true
      - run: cargo test --release --no-run -p dfdu-hangfs -p dfdu-engine -p dfdu
      - name: As root
        run: |
          as_root() { sudo --preserve-env=DFDU_FUSE_REQUIRED env "PATH=$PATH" "HOME=$HOME" "$@"; }
          as_root cargo test --release -p dfdu-hangfs --lib
          as_root cargo test --release -p dfdu-engine -p dfdu --test fuse
        env:
          DFDU_FUSE_REQUIRED: "1"

  btrfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The runner context is not available in job-level env.
      - run: echo "DFDU_BTRFS_DIR=$RUNNER_TEMP/btrfs" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y btrfs-progs btrfs-compsize
      - run: cargo test --release --no-run -p dfdu-sys -p dfdu-clean -p dfdu-engine -p dfdu-tui
      - name: Fixture
        run: sudo scripts/btrfs-fixture.sh "$RUNNER_TEMP/btrfs.img" "$DFDU_BTRFS_DIR" "$(id -un)"
      - name: Unprivileged
        run: |
          cargo test --release -p dfdu-sys -p dfdu-engine --test btrfs
          cargo test --release -p dfdu-tui --lib btrfs_tests
      - name: As root
        run: |
          as_root() { sudo --preserve-env=DFDU_BTRFS_DIR env "PATH=$PATH" "HOME=$HOME" "$@"; }
          as_root cargo test --release -p dfdu-sys -p dfdu-engine --test btrfs
          as_root cargo test --release -p dfdu-tui --lib btrfs_tests
          as_root cargo test --release -p dfdu-clean --lib
