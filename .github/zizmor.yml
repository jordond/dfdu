# release.yml is generated by `dist generate` (dist-workspace.toml); comments in it would be
# lost, so its accepted findings are listed here.
rules:
  # dist creates the GitHub Release and uploads to it from several jobs.
  excessive-permissions:
    ignore:
      - release.yml
  # The expansions are dist's own plan output and the tag name; the workflow runs on pushed
  # version tags (maintainers only) and on pull requests, where it only plans.
  template-injection:
    ignore:
      - release.yml
  # The matrix sets no container for any target (dist-workspace.toml uses hosted runners).
  unpinned-images:
    ignore:
      - release.yml
  # dist calls custom publish jobs (publish-homebrew.yml, which needs the tap token) with
  # `secrets: inherit` and a `./` path.
  secrets-inherit:
    ignore:
      - release.yml
  self-repository:
    ignore:
      - release.yml
