[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates pulled in by eframe's Linux backends, with no release to move to yet:
# winit's sctk-adwaita (ttf-parser) and accesskit_unix (zbus 5). Drop once eframe moves on.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via eframe > winit > sctk-adwaita" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via eframe > accesskit_unix > zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via eframe > accesskit_unix > zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via eframe > accesskit_unix > zbus 5" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

# rustls-platform-verifier uses it on wasm32 only, which dfdu does not build for.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# dfdu-gui: the fonts egui draws with, under the SIL Open Font and Ubuntu Font licences.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
