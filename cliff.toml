# git-cliff (https://git-cliff.org): CHANGELOG.md and the next version from the commits.
#
# Commits follow Conventional Commits (AGENTS.md): `feat` is Added, `fix` is Fixed, `perf` is
# Performance, and `chore`, `ci`, `test`, `docs`, `style`, `build` and `refactor` are left out.
# `cargo xtask release bump` takes the next version from them (`git-cliff --bumped-version`)
# and inserts its section into CHANGELOG.md; edit it before tagging.
#
# Commits before v0.3.0 are plain sentences ("Add ...", "Fix ..."): the parsers after the
# conventional ones group those by their first word and leave out the internal ones.

[changelog]
header = """
# Changelog

Notable changes to dfdu, newest first. Generated from the commits by git-cliff and edited by hand.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}\
{% set line = commit.message | split(pat="\n") | first | trim %}\
{% if commit.scope %}**{{ commit.scope }}:** {{ line }}\
{% elif line is starting_with("macOS") %}{{ line }}\
{% else %}{{ line | upper_first }}{% endif %}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
# Keep the plain commits from before v0.3.0; the parsers below sort them.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "oldest"
tag_pattern = "v[0-9].*"
commit_preprocessors = [
    # "(#16)" -> a link to the pull request.
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/jordond/dfdu/pull/${1}))" },
]
commit_parsers = [
    # Conventional commits. `message` is the raw first line here, type and scope included.
    { message = '^feat', group = "<!-- 0 -->Added" },
    { message = '^fix', group = "<!-- 2 -->Fixed" },
    { message = '^perf', group = "<!-- 3 -->Performance" },
    { message = '^revert', group = "<!-- 4 -->Removed" },
    # A breaking change of any other type is listed, not left out.
    { message = '^[a-z]+(\([^)]*\))?!:', group = "<!-- 1 -->Changed" },
    { footer = '^BREAKING[ -]CHANGE', group = "<!-- 1 -->Changed" },
    { message = '^(chore|ci|test|docs|style|build|refactor)', skip = true },

    # Plain commits from before v0.3.0. Left out: releases, merges, dependencies, CI, tests,
    # docs, the website, refactors between crates and other chores. `message` includes the
    # body, so these look at the first line only.
    { message = '^Release v', skip = true },
    { message = '^Merge ', skip = true },
    { message = '^(Bump|Update|Pin) .*(action|to v?[0-9])', skip = true },
    { message = '^[^\n]*(?i)\b(CI|clippy|zizmor|rustfmt|lint|lock checks?|the website|website|README|docs? page|bun\.lock|tests?)\b', skip = true },
    { message = '^(?i)minor\b', skip = true },
    { message = '^(?i)[^\n]*(\bdfdu-(session|engine|tree|scan|store|sys|sim)\b|SessionState|Engine::|Command::|^(wire|sim):)', skip = true },
    { message = '^(?i)[^\n]*(workflow|\bdemo\b|GIFs?\b|screenshots|benchmarks?|measurements|lock file|code of conduct|crates\.io|landing page|release notes|renovate|runner|cargo fmt|^format |security policy|scorecard|dead code)', skip = true },
    { message = '^([Aa]dd|[Ss]upport|[Oo]ffer|[Ii]ntroduce|[Pp]ackage|[Ii]nstall|[Ss]can|[Ss]how)', group = "<!-- 0 -->Added" },
    { message = '^([Ff]ix|[Kk]eep|[Hh]andle|[Aa]void|[Ss]top|[Rr]etry|[Rr]ecover|[Rr]efuse)', group = "<!-- 2 -->Fixed" },
    { message = '^([Ss]peed|[Ff]aster|[Rr]educe|[Cc]ut)', group = "<!-- 3 -->Performance" },
    { message = '^([Rr]emove|[Dd]rop|[Dd]elete)', group = "<!-- 4 -->Removed" },
    { message = '^(?i)[^\n]*(security|tighten)', group = "<!-- 5 -->Security" },
    { message = '.*', group = "<!-- 1 -->Changed" },
]

[bump]
# Before 1.0, a breaking change bumps the minor version and a feature the patch version.
features_always_bump_minor = false
breaking_always_bump_major = false
