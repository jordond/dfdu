[package]
name = "dfdu-update"
description = "Updates: the latest release, its assets checked against their published SHA-256, the CLI's archive unpacked, a running binary replaced, and how this copy was installed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
dfdu-sys.workspace = true
sha2.workspace = true
hex.workspace = true
ureq = { workspace = true, optional = true }
lzma-rust2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }

[features]
default = ["net"]
# Talks to the release server. Without it every download says the build has none, which keeps
# ring out of builds that cannot compile it (the Windows cross-check).
net = ["dep:ureq", "dep:lzma-rust2", "dep:tar"]

[dev-dependencies]
tempfile.workspace = true
lzma-rust2 = { workspace = true, features = ["encoder"] }
tar.workspace = true
