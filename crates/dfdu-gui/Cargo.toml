[package]
name = "dfdu-gui"
description = "Desktop browser for dfdu, in a window"
# The CLI's version: the GUI is released with it, on the same tag.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dfdu-tree.workspace = true
dfdu-dupes.workspace = true
dfdu-scan.workspace = true
dfdu-rules.workspace = true
dfdu-engine.workspace = true
dfdu-session.workspace = true
dfdu-store.workspace = true
dfdu-sys.workspace = true
dfdu-update.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
rfd.workspace = true

[features]
default = ["updates"]
# Checks for, downloads and installs updates, and the CLI. Without it the Updates window only
# says this build has no downloads (it keeps ring out of the Windows cross-check).
updates = ["dfdu-update/net"]

[target.'cfg(target_os = "linux")'.dependencies]
winit.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
lzma-rust2 = { workspace = true, features = ["encoder"] }
tar.workspace = true
tempfile.workspace = true

# Not part of the CLI's release (`dist`): the GUI ships its own installers.
[package.metadata.dist]
dist = false

# winit is a dependency only for its features (Wayland loaded at run time), never named in code.
[package.metadata.cargo-machete]
ignored = ["winit"]
