[package]
name = "dfdu-session"
description = "What a front end of dfdu shows besides drawing and input: the state of a browser with the view shown, its marks and name filter, the directory snapshot, tree mode, row order, fuzzy matching, the scan history and cache, the mounts left out, startup, the treemap, the cleanup view, the actions, duplicates, the largest files, an entry's details, the effects of a key and the theme palette"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dfdu-tree.workspace = true
dfdu-scan.workspace = true
dfdu-rules.workspace = true
dfdu-engine.workspace = true
dfdu-sys.workspace = true
dfdu-store.workspace = true
dfdu-dupes.workspace = true
crossbeam-channel.workspace = true
nucleo-matcher.workspace = true
toml.workspace = true
dunce.workspace = true

[features]
# Helpers for the tests of the crates above (`snapshot::build`, `snapshot::test_entry`,
# `Outside::set_mount`, `Outside::set_linked`, `test_support`).
test-support = ["dfdu-engine/test-support"]

[dev-dependencies]
dfdu-engine = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
