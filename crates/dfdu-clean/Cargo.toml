[package]
name = "dfdu-clean"
description = "Deletion: plans, verification against the scan, trash and permanent delete, journal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test-only hooks (a staged commit that hangs part-way).
fault-injection = []

[dependencies]
dfdu-tree.workspace = true
dfdu-rules.workspace = true
dunce.workspace = true
trash.workspace = true
crossbeam-channel.workspace = true
etcetera.workspace = true
crc32c.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
dfdu-sys.workspace = true

[dev-dependencies]
rand.workspace = true
dfdu-clean = { path = ".", features = ["fault-injection"] }
tempfile.workspace = true
