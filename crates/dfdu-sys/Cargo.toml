[package]
name = "dfdu-sys"
description = "The OS calls no safe crate provides (btrfs ioctls, FIEMAP, getattrlistbulk and Windows enumeration) behind safe wrappers, the disk list, what storage a directory is on, the usage of mounts the scan did not enter, where dfdu keeps its files (dirs), and the macOS privileged helper's SMAppService and XPC calls (helper)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# Not `workspace = true`: this is the one crate where `unsafe` is allowed, and only in blocks
# that state why they are sound.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
undocumented_unsafe_blocks = "deny"

[dependencies]
etcetera.workspace = true

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
rustix = { workspace = true }

# The disk list where no mount table is read directly: Linux reads `/proc/self/mountinfo` and
# macOS `getfsstat`, each mount sized on its own thread.
[target.'cfg(not(any(target_os = "linux", target_os = "macos")))'.dependencies]
sysinfo = { workspace = true }

# The privileged helper: `SMAppService`, the XPC handshake with the GUI, and the authorization
# each scan as root asks for.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true }
objc2 = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-foundation = { workspace = true }
objc2-security = { workspace = true }
objc2-service-management = { workspace = true }

[target.'cfg(windows)'.dependencies]
dfdu-tree = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
