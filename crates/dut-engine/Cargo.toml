[package]
name = "dut-engine"
description = "The applier: single writer of the tree, jobs, gate, accounting, hard links"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dut-tree.workspace = true
dut-scan.workspace = true
dut-clean.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
dunce.workspace = true
dut-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[features]
# Test-only hooks (Command::InjectPanic).
fault-injection = []

[target.'cfg(target_os = "linux")'.dev-dependencies]
dut-hangfs.workspace = true

[target.'cfg(loom)'.dev-dependencies]
loom.workspace = true

[dev-dependencies]
dut-engine = { path = ".", features = ["fault-injection"] }
dut-clean.workspace = true
tempfile.workspace = true
