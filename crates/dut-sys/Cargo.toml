[package]
name = "dut-sys"
description = "The OS calls no safe crate provides: btrfs ioctls and FIEMAP, behind safe wrappers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Not `workspace = true`: this is the one crate where `unsafe` is allowed, and only in blocks
# that state why they are sound.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
undocumented_unsafe_blocks = "deny"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile.workspace = true
