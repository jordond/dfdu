[package]
name = "dfdu"
description = "Disk usage browser for the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["disk-usage", "du", "ncdu", "tui", "cleanup"]
categories = ["command-line-utilities", "filesystem"]
publish.workspace = true

[lints]
workspace = true

[dependencies]
dfdu-tree.workspace = true
dfdu-scan.workspace = true
dfdu-rules.workspace = true
dfdu-engine.workspace = true
dfdu-tui.workspace = true
dfdu-sys.workspace = true
dfdu-store.workspace = true
dfdu-clean.workspace = true
dfdu-dupes.workspace = true
clap.workspace = true
clap_mangen.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
dunce.workspace = true
sha2.workspace = true
hex.workspace = true
ureq = { workspace = true, optional = true }
lzma-rust2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }

[features]
default = ["agent-download"]
# Downloads the release agent for `--remote` hosts of another platform. Without it, only this
# build and `DFDU_AGENT_DIR` can be sent.
agent-download = ["dep:ureq", "dep:lzma-rust2", "dep:tar"]

[dev-dependencies]
tempfile.workspace = true
boon.workspace = true
crossbeam-channel.workspace = true
lzma-rust2 = { workspace = true, features = ["encoder"] }
tar.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["pty", "termios"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
dfdu-hangfs.workspace = true

# Released through `dist` (dist-workspace.toml) although it is not published to crates.io.
[package.metadata.dist]
dist = true

# `cargo binstall dfdu` fetches the archives `dist` uploads to GitHub Releases.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/dfdu-{ target }{ archive-suffix }"
bin-dir = "dfdu-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"
