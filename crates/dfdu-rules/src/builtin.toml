# Built-in rules. The format is described in docs/rules.md.
#
# `verified` lists the platforms where a rule's paths were checked on a real machine
# (docs/rules.md); a path rule is enabled by default only there. Rules that match by name or
# marker have no platform-specific paths and no `verified` list.

schema_version = 1

# --- Generic ----------------------------------------------------------------------------------

[[rule]]
id = "generic.cachedir-tag"
category = "sys.cache"
name = "Tagged cache directory"
safety = "safe"
action = "delete"
explanation = "The directory holds a valid CACHEDIR.TAG (bford.info/cachedir), which marks its whole subtree as cache."
lost = "Cached data; the owning program recreates it."
min_size = "50 MiB"
priority = 10
[rule.match]
kind = "dir"
names = ["*"]
stop_descent = true
  [[rule.match.marker]]
  file = "CACHEDIR.TAG"
  prefix = "Signature: 8a477f597d28d172789f06886806bc55"
  required = true
[rule.guard]
not_vcs_tracked = true

# --- Project build output and dependencies ----------------------------------------------------

[[rule]]
id = "rust.target"
category = "dev.build"
name = "Rust build output (target/)"
safety = "regenerable"
action = "native"
explanation = "Build output of a Cargo project. Cargo writes CACHEDIR.TAG into the default target directory."
lost = "All compiled artifacts; the next build recompiles every crate."
min_size = "100 MiB"
min_age_days = 14
priority = 60
[rule.match]
kind = "dir"
names = ["target"]
stop_descent = true
top_most = true
  [[rule.match.sibling]]
  any_of = ["Cargo.toml"]
  [[rule.match.child]]
  any_of = ["CACHEDIR.TAG", ".rustc_info.json", "debug", "release"]
[rule.guard]
not_running = ["cargo", "rustc"]
not_vcs_tracked = true
[rule.native]
check = ["cargo", "--version"]
dry_run = ["cargo", "clean", "--dry-run"]
command = ["cargo", "clean"]
cwd = "{parent}"

[[rule]]
id = "node.node_modules"
category = "dev.deps"
name = "Node.js dependencies (node_modules)"
safety = "regenerable"
action = "delete"
explanation = "Installed packages for a JavaScript project. Reinstall with npm ci, pnpm install, yarn or bun install."
lost = "Installed packages; reinstalling needs network access unless the package manager cache has them."
min_size = "50 MiB"
min_age_days = 30
priority = 60
[rule.match]
kind = "dir"
names = ["node_modules"]
stop_descent = true
top_most = true
# A global install (lib/node_modules) and the packages bundled inside one, such as npm's own.
exclude = ["**/lib/node_modules", "**/lib/node_modules/**", "{home}/.nvm/**"]
  [[rule.match.sibling]]
  any_of = ["package.json"]
[rule.guard]
not_vcs_tracked = true
not_inside = ["**/*.app", "{program_files}"]
[rule.degrade]
  [[rule.degrade.when]]
  missing_sibling = ["package-lock.json", "npm-shrinkwrap.json", "yarn.lock", "pnpm-lock.yaml", "bun.lockb", "bun.lock"]
  safety = "review"
  reason = "No lockfile next to it: reinstalling may resolve different versions."

[[rule]]
id = "python.venv"
category = "dev.deps"
name = "Python virtual environment"
safety = "regenerable"
action = "delete"
explanation = "A virtual environment with the packages installed for a project."
lost = "Installed packages; recreate the environment and reinstall."
min_size = "50 MiB"
min_age_days = 30
priority = 60
[rule.match]
kind = "dir"
names = [".venv", "venv"]
stop_descent = true
  [[rule.match.child]]
  any_of = ["pyvenv.cfg"]
[rule.guard]
not_vcs_tracked = true
[rule.degrade]
  [[rule.degrade.when]]
  missing_sibling = ["uv.lock", "poetry.lock", "Pipfile.lock", "pdm.lock", "requirements.txt"]
  safety = "review"
  reason = "No lockfile or requirements.txt next to it: the installed versions may not be reproducible."

# --- Package manager caches --------------------------------------------------------------------

[[rule]]
id = "npm.cache"
category = "dev.pkgcache"
name = "npm cache"
safety = "safe"
action = "native"
verified = ["macos", "linux"]
explanation = "Content-addressed cache of downloaded npm packages."
lost = "Packages are downloaded again on the next install."
min_size = "100 MiB"
[rule.match]
kind = "dir"
paths = { macos = ["{home}/.npm/_cacache"], linux = ["{home}/.npm/_cacache"], windows = ["{local_data}/npm-cache/_cacache"] }
stop_descent = true
[rule.native]
check = ["npm", "--version"]
command = ["npm", "cache", "clean", "--force"]

[[rule]]
id = "pnpm.store"
category = "dev.pkgcache"
name = "pnpm store"
safety = "regenerable"
action = "native"
verified = ["macos"]
explanation = "The pnpm content-addressable store, hard-linked into projects' node_modules."
lost = "Packages not used by any project are downloaded again when needed. Deleting the store by hand breaks projects that link into it."
min_size = "200 MiB"
[rule.match]
kind = "dir"
paths = { macos = ["{home}/Library/pnpm/store", "{cache}/pnpm"], linux = ["{data}/pnpm/store", "{cache}/pnpm"], windows = ["{local_data}/pnpm/store", "{local_data}/pnpm-cache"] }
stop_descent = true
[rule.native]
check = ["pnpm", "--version"]
command = ["pnpm", "store", "prune"]

[[rule]]
id = "yarn.cache"
category = "dev.pkgcache"
name = "Yarn cache"
safety = "safe"
action = "delete"
verified = ["macos", "linux"]
explanation = "Downloaded package archives kept by Yarn."
lost = "Packages are downloaded again on the next install."
min_size = "100 MiB"
[rule.match]
kind = "dir"
paths = { macos = ["{cache}/Yarn"], linux = ["{cache}/yarn"], windows = ["{local_data}/Yarn/Cache"] }
stop_descent = true

[[rule]]
id = "bun.cache"
category = "dev.pkgcache"
name = "Bun install cache"
safety = "safe"
action = "delete"
verified = ["macos", "linux"]
explanation = "Packages downloaded by bun install."
lost = "Packages are downloaded again on the next install."
min_size = "100 MiB"
[rule.match]
kind = "dir"
paths = ["{env:BUN_INSTALL|{home}/.bun}/install/cache"]
stop_descent = true

[[rule]]
id = "pip.cache"
category = "dev.pkgcache"
name = "pip cache"
safety = "safe"
action = "delete"
verified = ["macos", "linux"]
explanation = "Downloaded and built wheels kept by pip."
lost = "Packages are downloaded or built again on the next install."
min_size = "100 MiB"
[rule.match]
kind = "dir"
paths = { macos = ["{cache}/pip"], linux = ["{cache}/pip"], windows = ["{local_data}/pip/Cache"] }
stop_descent = true

[[rule]]
id = "uv.cache"
category = "dev.pkgcache"
name = "uv cache"
safety = "safe"
action = "native"
verified = ["macos", "linux"]
explanation = "Packages, wheels and Python builds cached by uv."
lost = "Packages are downloaded again; environments that link into the cache are relinked by uv."
min_size = "100 MiB"
[rule.match]
kind = "dir"
paths = { macos = ["{env:UV_CACHE_DIR|{home}/.cache/uv}"], linux = ["{env:UV_CACHE_DIR|{cache}/uv}"], windows = ["{env:UV_CACHE_DIR|{local_data}/uv/cache}"] }
stop_descent = true
[rule.native]
check = ["uv", "--version"]
command = ["uv", "cache", "clean"]

[[rule]]
id = "cargo.registry"
category = "dev.pkgcache"
name = "Cargo registry and git caches"
safety = "regenerable"
action = "delete"
verified = ["macos", "linux"]
explanation = "Downloaded crate archives, their unpacked sources and git dependencies."
lost = "Crates are downloaded again on the next build; offline builds fail until then."
min_size = "200 MiB"
[rule.match]
kind = "dir"
# The two folders themselves, not cache/, src/, checkouts/ and db/ in them: cargo tags both
# with a CACHEDIR.TAG, and only a match on the same folder outranks the tag's rule, which
# stops the descent.
paths = ["{env:CARGO_HOME|{home}/.cargo}/registry", "{env:CARGO_HOME|{home}/.cargo}/git"]
stop_descent = true
[rule.guard]
not_running = ["cargo"]

[[rule]]
id = "go.build-cache"
category = "dev.pkgcache"
name = "Go build cache"
safety = "safe"
action = "native"
verified = ["macos", "linux"]
explanation = "Compiled packages and test results cached by the go command."
lost = "The next build recompiles."
min_size = "200 MiB"
[rule.match]
kind = "dir"
paths = { macos = ["{env:GOCACHE|{cache}/go-build}"], linux = ["{env:GOCACHE|{cache}/go-build}"], windows = ["{env:GOCACHE|{local_data}/go-build}"] }
stop_descent = true
[rule.native]
check = ["go", "version"]
command = ["go", "clean", "-cache"]

[[rule]]
id = "go.module-cache"
category = "dev.pkgcache"
name = "Go module cache"
safety = "regenerable"
action = "native"
verified = ["macos", "linux"]
explanation = "Downloaded Go modules. The files are read-only, so go clean removes them, not rm."
lost = "Modules are downloaded again on the next build."
min_size = "200 MiB"
[rule.match]
kind = "dir"
paths = ["{env:GOMODCACHE|{env:GOPATH|{home}/go}/pkg/mod}"]
stop_descent = true
[rule.native]
check = ["go", "version"]
command = ["go", "clean", "-modcache"]

[[rule]]
id = "gradle.user-caches"
category = "dev.pkgcache"
name = "Gradle caches and wrapper distributions"
safety = "regenerable"
action = "delete"
verified = ["macos", "linux"]
explanation = "Downloaded dependencies, transformed artifacts, build cache and wrapper distributions under the Gradle user home."
lost = "Dependencies and Gradle distributions are downloaded again on the next build."
min_size = "500 MiB"
priority = 60
[rule.match]
kind = "dir"
paths = ["{env:GRADLE_USER_HOME|{home}/.gradle}/caches", "{env:GRADLE_USER_HOME|{home}/.gradle}/wrapper/dists"]
stop_descent = true
[rule.guard]
not_running = ["java"]

[[rule]]
id = "maven.repository"
category = "dev.pkgcache"
name = "Maven local repository"
safety = "regenerable"
action = "delete"
verified = ["macos", "linux"]
explanation = "Artifacts downloaded by Maven (and by Gradle builds that use mavenLocal)."
lost = "Artifacts are downloaded again; artifacts installed with mvn install that exist nowhere else are gone."
min_size = "500 MiB"
[rule.match]
kind = "dir"
paths = ["{home}/.m2/repository"]
stop_descent = true

[[rule]]
id = "homebrew.cache"
category = "dev.pkgcache"
name = "Homebrew download cache"
safety = "safe"
action = "native"
verified = ["macos", "linux"]
platforms = ["macos", "linux"]
explanation = "Downloaded bottles and source archives kept by Homebrew."
lost = "Packages are downloaded again if reinstalled."
min_size = "200 MiB"
[rule.match]
kind = "dir"
paths = ["{env:HOMEBREW_CACHE|{cache}/Homebrew}"]
stop_descent = true
[rule.native]
check = ["brew", "--version"]
dry_run = ["brew", "cleanup", "--dry-run", "--prune=all"]
command = ["brew", "cleanup", "--prune=all"]

[[rule]]
id = "cocoapods.cache"
category = "dev.pkgcache"
name = "CocoaPods cache"
safety = "safe"
action = "delete"
verified = ["macos"]
platforms = ["macos"]
explanation = "Downloaded pod sources kept by CocoaPods."
lost = "Pods are downloaded again on the next pod install."
min_size = "100 MiB"
[rule.match]
kind = "dir"
paths = ["{cache}/CocoaPods"]
stop_descent = true

# --- Xcode -------------------------------------------------------------------------------------

[[rule]]
id = "xcode.derived-data"
category = "dev.xcode"
name = "Xcode DerivedData"
platforms = ["macos"]
verified = ["macos"]
safety = "safe"
action = "delete"
explanation = "Per-project build products, indexes and logs created by Xcode."
lost = "The next build and indexing take longer."
min_size = "200 MiB"
[rule.match]
kind = "dir"
paths = ["{home}/Library/Developer/Xcode/DerivedData/*"]
exclude = ["{home}/Library/Developer/Xcode/DerivedData/ModuleCache.noindex"]
stop_descent = true
[rule.guard]
not_running = ["Xcode", "xcodebuild"]

[[rule]]
id = "xcode.device-support"
category = "dev.xcode"
name = "Xcode device support files"
platforms = ["macos"]
verified = ["macos"]
safety = "regenerable"
action = "delete"
explanation = "Debug symbols copied from connected devices, one folder per OS version (about 2-5 GB each)."
lost = "Xcode copies them again the next time a device with that OS version is connected for debugging."
min_size = "500 MiB"
[rule.match]
kind = "dir"
paths = ["{home}/Library/Developer/Xcode/*OS DeviceSupport/*"]
stop_descent = true
[rule.guard]
not_running = ["Xcode"]

[[rule]]
id = "xcode.archives"
category = "dev.xcode"
name = "Xcode archives"
platforms = ["macos"]
verified = ["macos"]
safety = "review"
action = "trash"
explanation = "App archives made with Product > Archive, kept for distribution and for symbolicating crash reports."
lost = "The archived build and its dSYMs; crash reports from that version can no longer be symbolicated."
min_size = "200 MiB"
[rule.match]
kind = "dir"
paths = ["{home}/Library/Developer/Xcode/Archives/*/*.xcarchive"]
stop_descent = true

[[rule]]
id = "xcode.simulator-devices"
category = "dev.xcode"
name = "Simulator devices"
platforms = ["macos"]
verified = ["macos"]
safety = "review"
action = "native"
explanation = "Data of the simulator devices: installed apps, their data and settings. Simulator runtimes under /Library/Developer/CoreSimulator are managed by simctl and stay protected."
lost = "Apps and data installed in the simulators that are removed."
min_size = "1 GiB"
[rule.match]
kind = "dir"
paths = ["{home}/Library/Developer/CoreSimulator/Devices"]
stop_descent = true
[rule.guard]
not_running = ["Simulator"]
[rule.native]
check = ["xcrun", "simctl", "help"]
dry_run = ["xcrun", "simctl", "list", "devices", "unavailable"]
command = ["xcrun", "simctl", "delete", "unavailable"]
[[rule.native.variant]]
name = "also simulator runtimes that cannot be used"
dry_run = ["xcrun", "simctl", "runtime", "delete", "--unusable", "--dry-run"]
command = ["xcrun", "simctl", "runtime", "delete", "--unusable"]

[[rule]]
id = "xcode.caches"
category = "dev.xcode"
name = "Xcode and simulator caches"
platforms = ["macos"]
verified = ["macos"]
safety = "safe"
action = "delete"
explanation = "Caches of Xcode and CoreSimulator."
lost = "Rebuilt as Xcode and the simulators run."
min_size = "100 MiB"
[rule.match]
kind = "dir"
paths = ["{cache}/com.apple.dt.Xcode", "{home}/Library/Developer/CoreSimulator/Caches"]
stop_descent = true

# --- Android -----------------------------------------------------------------------------------

[[rule]]
id = "android.avd"
category = "dev.android"
name = "Android emulator (AVD)"
safety = "review"
action = "native"
verified = ["macos", "linux"]
explanation = "An Android Virtual Device: emulator disk images, user data, installed apps and quick-boot snapshots."
lost = "Everything installed or stored inside the emulator."
min_size = "500 MiB"
[rule.match]
kind = "dir"
names = ["*.avd"]
paths = ["{env:ANDROID_AVD_HOME|{env:ANDROID_USER_HOME|{home}/.android}/avd}/*.avd"]
stop_descent = true
  [[rule.match.sibling]]
  any_of = ["{name_stem}.ini"]
  [[rule.match.child]]
  any_of = ["config.ini"]
[rule.guard]
not_running = ["qemu-system-x86_64", "qemu-system-aarch64", "emulator"]
[rule.native]
check = ["avdmanager", "list", "avd", "-c"]
command = ["avdmanager", "delete", "avd", "-n", "{name_stem}"]

[[rule]]
id = "android.system-images"
category = "dev.android"
name = "Android system images"
safety = "regenerable"
action = "delete"
verified = ["macos", "linux"]
explanation = "Emulator system images, one folder per API level. Emulators made from a removed image stop working until it is installed again."
lost = "The image is downloaded again with the SDK Manager (1-3 GB each)."
min_size = "500 MiB"
[rule.match]
kind = "dir"
paths = { macos = ["{env:ANDROID_HOME|{home}/Library/Android/sdk}/system-images/*"], linux = ["{env:ANDROID_HOME|{home}/Android/Sdk}/system-images/*"], windows = ["{env:ANDROID_HOME|{local_data}/Android/Sdk}/system-images/*"] }
stop_descent = true

# --- Containers --------------------------------------------------------------------------------

[[rule]]
id = "docker.desktop-disk"
category = "dev.containers"
name = "Docker Desktop disk image"
platforms = ["macos", "windows"]
verified = ["macos"]
safety = "manual"
action = "native"
explanation = "The virtual disk that holds Docker Desktop's images, containers, volumes and build cache. Deleting the file loses all of them; docker system prune frees space inside it."
lost = "With prune: stopped containers, unused networks, dangling images and build cache. Volumes are kept."
min_size = "1 GiB"
[rule.match]
kind = "file"
paths = { macos = ["{home}/Library/Containers/com.docker.docker/Data/vms/0/data/Docker.raw"], windows = ["{local_data}/Docker/wsl/*/*.vhdx"] }
[rule.native]
check = ["docker", "info"]
size_command = ["docker", "system", "df", "--format", "json"]
dry_run = ["docker", "system", "df", "-v"]
command = ["docker", "system", "prune", "--force"]
[[rule.native.variant]]
name = "also every image no container uses"
command = ["docker", "system", "prune", "--all", "--force"]
[[rule.native.variant]]
name = "also anonymous volumes no container uses"
command = ["docker", "system", "prune", "--volumes", "--force"]

[[rule]]
id = "orbstack.data"
category = "dev.containers"
name = "OrbStack data"
platforms = ["macos"]
verified = []
safety = "manual"
action = "report"
explanation = "OrbStack's container and machine data. Clean up from OrbStack or with docker system prune."
lost = "Containers, images, volumes and Linux machines."
min_size = "1 GiB"
[rule.match]
kind = "dir"
paths = ["{home}/Library/Group Containers/HUAQ24HBR6.dev.orbstack/data", "{home}/.orbstack/data"]
stop_descent = true

[[rule]]
id = "podman.storage"
category = "dev.containers"
name = "Podman storage"
platforms = ["linux"]
verified = []
safety = "manual"
action = "native"
explanation = "Images, containers and volumes of rootless Podman."
lost = "With prune: stopped containers, unused images and build cache."
min_size = "1 GiB"
[rule.match]
kind = "dir"
paths = ["{data}/containers/storage"]
stop_descent = true
[rule.native]
check = ["podman", "info"]
command = ["podman", "system", "prune", "--force"]

# --- Toolchains and IDEs ---------------------------------------------------------------------

[[rule]]
id = "rustup.toolchains"
category = "dev.toolchains"
name = "Rust toolchains"
safety = "regenerable"
action = "native"
verified = ["macos", "linux"]
explanation = "Toolchains installed by rustup, one folder per channel and target."
lost = "The toolchain is downloaded again when a project asks for it."
min_size = "500 MiB"
[rule.match]
kind = "dir"
paths = ["{env:RUSTUP_HOME|{home}/.rustup}/toolchains/*"]
stop_descent = true
[rule.native]
check = ["rustup", "--version"]
command = ["rustup", "toolchain", "uninstall", "{name}"]

[[rule]]
id = "jetbrains.caches"
category = "dev.ide"
name = "JetBrains IDE caches"
safety = "regenerable"
action = "delete"
verified = ["macos"]
explanation = "Indexes and caches of JetBrains IDEs and Android Studio, one folder per IDE version."
lost = "The IDE re-indexes projects on the next start; old versions' folders are not used again."
min_size = "200 MiB"
[rule.match]
kind = "dir"
paths = { macos = ["{cache}/JetBrains/*", "{cache}/Google/AndroidStudio*"], linux = ["{cache}/JetBrains/*", "{cache}/Google/AndroidStudio*"], windows = ["{local_data}/JetBrains/*", "{local_data}/Google/AndroidStudio*"] }
# JetBrains Toolbox keeps its app and downloads there, not an IDE's caches ({cache} is
# {local_data} on Windows).
exclude = ["{cache}/JetBrains/Toolbox*"]
stop_descent = true

[[rule]]
id = "vscode.caches"
category = "dev.ide"
name = "VS Code caches"
safety = "safe"
action = "delete"
verified = ["macos"]
explanation = "HTTP, code and extension download caches of VS Code."
lost = "Rebuilt as VS Code runs."
min_size = "100 MiB"
[rule.match]
kind = "dir"
paths = ["{config}/Code/Cache", "{config}/Code/CachedData", "{config}/Code/CachedExtensionVSIXs", "{config}/Code/Service Worker/CacheStorage"]
stop_descent = true

