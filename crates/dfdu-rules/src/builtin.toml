[[rule]]
id = "browser.chrome-cache"
category = "app.browser"
name = "Chrome cache"
safety = "safe"
action = "delete"
verified = ["macos"]
explanation = "The HTTP and code cache of Google Chrome."
lost = "Pages load more slowly until the cache fills again."
min_size = "200 MiB"
[rule.match]
