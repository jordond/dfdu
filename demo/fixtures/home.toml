# The home directory most recordings browse: projects with dependencies and build output,
# package caches, downloads with duplicates, photos and videos, a few unreadable entries and
# slow directories so the live scan is visible. Paths are relative to $HOME (/home/demo).
# Ages count back from `now`, the time the recordings run at.

