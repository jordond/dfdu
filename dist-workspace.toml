[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
cargo-dist-version = "0.33.1"
ci = "github"
# Shell installs on macOS and Linux go through install.sh at the repo root.
installers = ["powershell", "homebrew"]
tap = "jordond/homebrew-tap"
# "./publish-homebrew" is dist's Homebrew job with the man pages and completions linked;
# "./notarize-macos" notarises the macOS binaries dist signed.
publish-jobs = ["./publish-homebrew", "./notarize-macos"]
# Developer ID signing of the macOS binaries (secrets CODESIGN_CERTIFICATE, a base64 .p12,
# CODESIGN_CERTIFICATE_PASSWORD and CODESIGN_IDENTITY), with hardened runtime set by
# .github/build-setup.yml.
# The GUI's installers (.github/workflows/gui-release.yml), uploaded to the release once dist
# has created it; after the announcement so prereleases get them too (publish jobs skip those).
post-announce-jobs = ["./gui-release"]
github-custom-job-permissions = { "gui-release" = { contents = "write", id-token = "write", attestations = "write" } }
macos-sign = true
# SLSA build provenance for every release artifact (`gh attestation verify`).
github-attestations = true
github-build-setup = "../build-setup.yml"
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
install-updater = false
precise-builds = true
pr-run-mode = "plan"
# Man pages and completions, kept current by crates/dfdu/tests/assets.rs.
include = ["assets/man/", "assets/completions/"]

# The same pinned versions as ci.yml (zizmor refuses unpinned actions).
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2

# dist 0.32 builds aarch64-apple-darwin on macos-14, which GitHub retires on 2026-11-02.
[dist.github-custom-runners]
# plan, host and announce: dist defaults these to ubuntu-22.04.
global = "ubuntu-26.04"
aarch64-apple-darwin = "macos-26"
