[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell", "homebrew"]
tap = "jordond/homebrew-tap"
# "./publish-homebrew" is dist's Homebrew job with the man pages and completions linked.
publish-jobs = ["./publish-homebrew"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
install-updater = false
precise-builds = true
pr-run-mode = "plan"
# Man pages and completions, kept current by crates/dfdu/tests/assets.rs.
include = ["assets/man/", "assets/completions/"]

# The same pinned versions as ci.yml (zizmor refuses unpinned actions).
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2

# dist 0.32 builds aarch64-apple-darwin on macos-14, which GitHub retires on 2026-11-02.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-26"
